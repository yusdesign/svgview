name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string
        default: 'v1.0.0'
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
          - web

env:
  APP_NAME: svgview
  APP_ID: com.yusdesign.svgview
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-release:
    name: 🏗️ Build Web ${{ github.event.inputs.version }}
    runs-on: ubuntu-latest
    if: github.event.inputs.platform == 'web' || github.event.inputs.platform == 'all'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'  # ✅ Changed to 24
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      
      - name: 🏗️ Build web app
        run: npm run build
      
      - name: 📦 Package web build
        run: |
          mkdir -p release
          cd dist && zip -r ../release/svgview-web-${{ github.event.inputs.version }}.zip . && cd ..
      
      - name: 📤 Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: release/
          retention-days: 30

  build-android-release:
    name: 🤖 Build Android ${{ github.event.inputs.version }}
    runs-on: ubuntu-latest
    if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'  # ✅ Changed to 24
          cache: 'npm'
      
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'  # Keep Java 17 for Android compatibility
      
      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      
      - name: 📱 Initialize Capacitor
        run: npx cap init "${{ env.APP_NAME }}" "${{ env.APP_ID }}" --web-dir=dist
      
      - name: 📱 Install Capacitor Android
        run: npx cap add android
      
      - name: 🏗️ Build web app
        run: npm run build
      
      - name: 🔄 Sync Capacitor
        run: npx cap sync android
      
      - name: 🏗️ Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          ./gradlew bundleRelease
      
      - name: 📤 Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

  build-ios-release:
    name: 🍎 Build iOS ${{ github.event.inputs.version }}
    runs-on: macos-latest
    if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
  
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
  
      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: 🌍 Install Capacitor globally
        run: npm install -g @capacitor/cli
  
      - name: 📱 Initialize Capacitor
        run: cap init "${{ env.APP_NAME }}" "${{ env.APP_ID }}" --web-dir=dist
  
      - name: 🍎 Install Capacitor iOS
        run: cap add ios
  
      - name: 🏗️ Build web app
        run: npm run build
  
      - name: 🔄 Sync Capacitor
        run: cap sync ios
  
      - name: 🏗️ Build iOS app
        run: |
          cd ios
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -derivedDataPath build \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO
          elif [ -d "App/App.xcworkspace" ]; then
            cd App
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -derivedDataPath build \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO
          elif [ -d "App/App.xcodeproj" ]; then
            cd App
            xcodebuild -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -derivedDataPath build \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "❌ No workspace or project found!"
            find . -name "*.xcworkspace" -o -name "*.xcodeproj"
            exit 1
          fi
  
  create-release:
    name: 📦 Create Release ${{ github.event.inputs.version }}
    runs-on: ubuntu-latest
    needs: [build-release, build-android-release, build-ios-release]
    if: always()
    
    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      
      - name: 📂 List downloaded artifacts
        run: |
          echo "📁 Downloaded artifacts:"
          ls -la artifacts/
          find artifacts/ -type f -name "*.zip" -o -name "*.apk" || echo "No files found"
      
      - name: 📦 Prepare release assets
        run: |
          mkdir -p release-assets
          
          # Copy web build
          if [ -d "artifacts/release-web" ]; then
            cp -r artifacts/release-web/* release-assets/ || echo "No web files"
          fi
          
          # Copy Android APK
          if [ -d "artifacts/release-android" ]; then
            cp artifacts/release-android/*.apk release-assets/ || echo "No APK files"
          fi
          
          # Copy iOS build
          if [ -d "artifacts/release-ios" ]; then
            mkdir -p release-assets/ios
            cp -r artifacts/release-ios/* release-assets/ios/ || echo "No iOS files"
          fi
          
          echo "📁 Release assets:"
          ls -la release-assets/
      
      - name: 📝 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: "svgview ${{ github.event.inputs.version }}"
          draft: false
          prerelease: false
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
