name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# 👇 Add this to suppress Node 20 deprecation warning
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  deploy:
    name: 🌐 Deploy Web App
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'  # Use Node 24
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build
        run: GITHUB_PAGES=true npm run build

      - name: ✅ Verify build
        run: |
          echo "📁 Build contents:"
          ls -la dist/
          echo "📁 Checking index.html for base path:"
          grep -o 'href="/[^"]*"' dist/index.html | head -5      
      
      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@v4
      
      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
