name: Build svgview App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
          - web

env:
  APP_NAME: svgview
  APP_ID: com.yusdesign.svgview

jobs:
  build-web:
    name: 🌐 Build Web Version
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'web' || github.event.inputs.platform == 'all'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🏗️ Build web app
        run: npm run build
      
      - name: 📤 Upload web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/
          retention-days: 30

  build-android:
    name: 🤖 Build Android App
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: 📦 Install dependencies
        run: npm install

      - name: 🌍 Install Capacitor globally
        run: npm install -g @capacitor/cli

      - name: 📱 Initialize Capacitor
        run: npx cap init "${{ env.APP_NAME }}" "${{ env.APP_ID }}" --web-dir=dist
              
      - name: 📱 Install Capacitor Android
        run: npx cap add android
      
      - name: 🏗️ Build web app
        run: npm run build
      
      - name: 🔄 Sync Capacitor
        run: npx cap sync android
      
      - name: 🏗️ Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      
      - name: 📤 Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
      
      - name: 📤 Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/debug/*.aab
          retention-days: 30

  build-ios:
    name: 🍎 Build iOS App
    runs-on: macos-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all'
  
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
    
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
    
      - name: 📦 Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/ios @capacitor/filesystem @capacitor/device
    
      - name: 🔍 Verify Capacitor
        run: |
          cap --version
          npx cap --version || echo "Using global cap"
    
      - name: 📱 Initialize Capacitor
        run: |
          cap init "${{ env.APP_NAME }}" "${{ env.APP_ID }}" --web-dir=dist || \
          npx cap init "${{ env.APP_NAME }}" "${{ env.APP_ID }}" --web-dir=dist
    
      - name: 🍎 Install Capacitor iOS
        run: |
          cap add ios || \
          npx cap add ios
    
      - name: 🏗️ Build web app
        run: npm run build
    
      - name: 🔄 Sync Capacitor
        run: |
          cap sync ios || \
          npx cap sync ios
    
      - name: 🏗️ Build iOS app
        run: |
          cd ios/App
          echo "📁 Current directory: $(pwd)"
          echo "📁 Contents:"
          ls -la
        
          # Try with cap command first
          if command -v cap &> /dev/null; then
            echo "📱 Building with cap command..."
            cap open ios || true
          fi
        
          # Try different workspace/project paths
          if [ -d "App.xcworkspace" ]; then
            echo "✅ Found workspace: App.xcworkspace"
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -configuration Debug \
              -derivedDataPath build \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO
          elif [ -d "App.xcodeproj" ]; then
            echo "✅ Found project: App.xcodeproj"
            xcodebuild -project App.xcodeproj \
              -scheme App \
              -configuration Debug \
              -derivedDataPath build \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "❌ No workspace or project found!"
            echo "📁 Searching for workspace files..."
            find . -name "*.xcworkspace" -o -name "*.xcodeproj"
          
            # Try to generate with Capacitor
            cd ../..
            cap sync ios
            cd ios/App
          
            if [ -d "App.xcworkspace" ]; then
              echo "✅ Workspace created after sync!"
              xcodebuild -workspace App.xcworkspace \
                -scheme App \
                -configuration Debug \
                -derivedDataPath build \
                -destination 'generic/platform=iOS' \
                CODE_SIGNING_ALLOWED=NO
            else
              echo "❌ Still no workspace found, exiting"
              exit 1
            fi
          fi
    
      - name: 📤 Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            ios/App/build/Debug-iphoneos/*.app
            ios/build/Debug-iphoneos/*.app
            ios/App/build/Release-iphoneos/*.app
          retention-days: 30

  release:
    name: 🚀 Create Release
    runs-on: ubuntu-latest
    needs: [build-web, build-android, build-ios]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      
      - name: 📦 Prepare release assets
        run: |
          mkdir -p release-assets
          # Copy web build
          cp -r artifacts/web-build/* release-assets/web/
          # Copy Android APK
          cp artifacts/android-apk/*.apk release-assets/ || true
          # Copy iOS build
          cp -r artifacts/ios-build/* release-assets/ios/ || true
          # Create zip of web build
          cd release-assets/web && zip -r ../svgview-web.zip . && cd ../..
      
      - name: 🏷️ Get version
        id: version
        run: |
          VERSION=$(date +'%Y.%m.%d-%H%M')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: 📝 Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "svgview v${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          files: |
            release-assets/svgview-web.zip
            release-assets/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
